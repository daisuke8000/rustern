# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ja-JP

tone_instructions: "簡潔に。重大度を明示。rustfmt/スタイルの指摘は避け、正しさ・非同期・K8s・セキュリティを優先。"

reviews:
  profile: assertive
  poem: false
  review_details: false
  fail_commit_status: true
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: true
  related_prs: false

  instructions: |
    rustern: multi-pod Kubernetes log tailer; stern/kubectl behavioral parity is the north star.
    Read .github/copilot-instructions.md (including Cumulative CodeRabbit learnings) for full standards.
    Do not comment on rustfmt/style already enforced in CI.
    Prioritize correctness, async/cancellation, kube client usage, resource leaks, and parity regressions.
    Review comments in Japanese; keep code identifiers and API names in English.
    Review skipped status does not mean zero actionable inline comments.

  path_filters:
    - "!target/**"

  path_instructions:
    - path: "crates/rustern-core/src/discovery/**"
      instructions: |
        Kubernetes discovery and pod watching:
        - Watch gaps, stale cache, and reconcile correctness when pods/containers change.
        - Namespace and label/field selector behavior must match stern/kubectl parity expectations.
        - `--field-selector` with explicit `.` pod query must normalize `.` → `.*`; require regression tests for selector+query combos.
        - Handle kube API errors without panicking; avoid unbounded retries.
        - Flag RBAC-sensitive assumptions and cross-namespace leaks.

    - path: "crates/rustern-core/src/runtime/cursor_store.rs"
      instructions: |
        Reconnect cursor store:
        - No blocking Mutex::lock from async or Stream::poll_next; use try_lock + bounded yield/spin only.
        - Distinguish poisoned mutex (warn once, no retry) from contention (retry then warn).
        - Do not suggest tokio::Mutex or new deps unless PR already adds them for a documented reason.

    - path: "crates/rustern-core/src/runtime/**"
      instructions: |
        Runtime (attach, mux, watch, run):
        - Cancellation and stream shutdown must not leak tasks or leave hung attaches.
        - No blocking I/O inside async contexts; verify backpressure on multiplexed log streams.
        - Race conditions when pods restart or containers churn.
        - Watch orchestration: WatchAdmission vs AttachDeps; PodMetaCache methods only—no exposed HashMap in callers.
        - admit_pod: false when metadata.name missing (and namespace when allowed_ns set)—no empty-string fallback.
        - pod_meta cache: Init clears, InitDone prunes snapshot outsiders, reject/delete removes entries.
        - TestOrchestratorFixture keepalive (mock handle + mux drain) must outlive tests; `_fixture` tuple bindings are intentional.
        - Skip nitpicks on TestOrchestratorBuilder sugar or post-build fixture mutation unless they hide real bugs.

    - path: "crates/rustern-core/src/pipeline/**"
      instructions: |
        Log pipeline and filtering:
        - Line handling, include/exclude, jq, and JSON annotation correctness.
        - Exit trigger ordering: FilterOn::Original + --exit-on-level must not evaluate -i/-e only after jq in ways that break stern semantics.
        - Keep stage_order and helpers pub(crate) unless public API is intentional.
        - Performance on hot paths (per-line allocations, regex reuse).

    - path: "crates/rustern-core/src/source/**"
      instructions: |
        Log sources and pod metadata:
        - PodLogRequest / follow semantics and error paths.
        - PodLocator::try_from_pod requires name, namespace, uid—no default empty namespace.
        - Compatibility with kube client streaming APIs.

    - path: "src/cli/**"
      instructions: |
        CLI surface:
        - Flag combinations and defaults must align with stern/kubectl parity (see run_defaults).
        - Validation errors should be actionable; avoid breaking positional/query semantics.

    - path: "src/run_defaults.rs"
      instructions: |
        Default resolution (pod query, namespaces, selectors):
        - Changes here affect stern parity; require tests or documented parity rationale.
        - Optional pod query with -l/--field-selector and context default namespace behavior.

    - path: "src/run_config/**"
      instructions: |
        Run configuration assembly:
        - Ensure resolved config matches CLI inputs and discovery expectations.

    - path: ".github/copilot-instructions.md"
      instructions: |
        Review guidance doc:
        - Source comments English; review comments Japanese.
        - Public PRs: Linear ID only, no Linear URLs; branch naming feat|fix|refactor|chore/dsk-<id>-<desc>.
        - Keep cumulative learnings section updated when recurring review themes appear.

    - path: "**/*.rs"
      instructions: |
        General Rust (rustern):
        - Prefer Result over unwrap/expect on production paths.
        - Idiomatic error types (thiserror); no new panics without strong justification.
        - Do not duplicate rustfmt/style feedback covered by CI.
        - Source code comments must be in English; review comments should stay Japanese (language: ja-JP).
        - No drive-by refactors unrelated to the PR.
        - Test set comparisons for containers/streams should be order-independent (HashSet).

    - path: ".github/workflows/**"
      instructions: |
        CI workflows:
        - GitHub Actions must use immutable commit SHAs, not floating @v tags.
        - No secrets in logs; appropriate timeouts for test jobs.

    - path: "**/Cargo.toml"
      instructions: |
        Workspace manifests:
        - Dependency bumps need supply-chain rationale; kube/k8s-openapi versions affect API surface.
        - Avoid unnecessary default-features expansion on kube.

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: |
        Use Conventional Commits (feat:, fix:, chore:, docs:, test:, refactor:).
        Keep under 72 characters; be specific.
    description:
      mode: warning
    issue_assessment:
      mode: "off"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

  tools:
    github-checks:
      enabled: true
      timeout_ms: 900000
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    osvScanner:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    ast-grep:
      essential_rules: true
    clippy:
      enabled: false

  auto_review:
    labels:
      - "!skip-review"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

chat:
  integrations:
    linear:
      usage: disabled

knowledge_base:
  code_guidelines:
    filePatterns:
      - ".github/copilot-instructions.md"
  learnings:
    scope: local
  pull_requests:
    scope: local
  issues:
    scope: local
  linear:
    usage: enabled
    team_keys:
      - DSK
