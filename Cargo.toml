[workspace]
resolver = "2"
members = ["crates/rustern-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tracing = "0.1"
kube = { version = "4.0.0", default-features = false, features = [
    "client",
    "config",
    "runtime",
    "rustls-tls",
] }
k8s-openapi = { version = "0.27.1", features = ["v1_31"] }
regex = "1"
bytes = "1"
jaq-core = "3"
jaq-std = "3"
jaq-json = { version = "2", features = ["serde"] }
tempfile = "3"
miette = { version = "7.6", features = ["fancy"] }
humantime = "2"
chrono-tz = "0.10"
jiff = { version = "0.2", default-features = false, features = ["std"] }
secrecy = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[package]
name = "rustern"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Kubernetes multi pod and container log tailing in Rust inspired by stern"

[[bin]]
name = "rstn"
path = "src/main.rs"

[dependencies]
rustern-core = { path = "crates/rustern-core" }
clap = { version = "4", features = ["derive", "env"] }
regex = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
miette = { workspace = true }
humantime = { workspace = true }
rustls = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
tempfile = "3"
