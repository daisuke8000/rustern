name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout@v4.3.1 — tag may move; this SHA pins the audited tree.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # dtolnay/rust-toolchain@v1 — same as above (immutable commit).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.88"
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Test
        run: cargo test --workspace --locked --verbose
