name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.88"

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      # RustSec advisory-db scan of Cargo.lock
      - name: Advisory scan
        run: cargo audit

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Immutable commit pin (moving @v tags are not used). Not necessarily the newest release tag; Dependabot proposes bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain@v1 — same as above (immutable commit).
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: "1.88"
          components: rustfmt, clippy

      - name: Format
        id: format
        background: true
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Wait for format
        wait: format

      - name: Test
        run: cargo test --workspace --locked --verbose
