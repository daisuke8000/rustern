name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.88"

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked

      # RustSec advisory-db scan of Cargo.lock
      - name: Advisory scan
        run: cargo audit

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Immutable commit pin (moving @v tags are not used). Not necessarily the newest release tag; Dependabot proposes bumps.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # dtolnay/rust-toolchain@v1 — same as above (immutable commit).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.88"
          components: rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --locked --verbose

      - name: Test
        run: cargo test --workspace --locked --verbose
